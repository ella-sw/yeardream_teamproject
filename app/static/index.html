<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공공 웹사이트 불법광고 탐지 도구</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <p class="eyebrow">LOCAL WEBSITE INSPECTOR · M1 PROTOTYPE</p>
        <h1>공공 웹사이트<br>불법광고 탐지</h1>
        <p class="intro">점검 권한이 있는 웹사이트 URL을 입력하면 첫 페이지의 숨겨진 광고 의심 요소를 확인합니다.</p>
      </header>

      <section class="panel" aria-labelledby="scan-heading">
        <h2 id="scan-heading">새 검사</h2>
        <form id="scan-form">
          <label for="entry-url">진입 URL</label>
          <div class="input-row">
            <input id="entry-url" name="entry_url" type="url" inputmode="url" placeholder="https://example.go.kr" required maxlength="2048" autocomplete="url">
            <button id="start-button" type="submit">검사 시작</button>
          </div>
        </form>
        <p class="scope-note">현재 구현 범위: 입력한 페이지 1개 · display:none 기반 OFFSCREEN 탐지</p>
      </section>

      <section id="scan-panel" class="panel scan-panel" aria-live="polite" hidden>
        <div class="status-line">
          <div>
            <p class="eyebrow">검사 상태</p>
            <h2 id="scan-state">대기 중</h2>
          </div>
          <button id="cancel-button" class="secondary-button" type="button" hidden>취소</button>
        </div>
        <p id="scan-message" class="muted"></p>
        <p id="scan-counts" class="counts"></p>
        <div id="warning-list" class="warning-list"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>유형</th><th>페이지</th><th>근거 원문</th><th>위치</th></tr></thead>
            <tbody id="findings-body"></tbody>
          </table>
        </div>
        <a id="result-file" class="file-link" hidden>result.json 열기</a>
      </section>

      <footer>
        <span>검사 결과는 참고용 의심 신호이며 위법성을 확정하지 않습니다.</span>
        <span id="server-version">v0.1.0</span>
      </footer>
    </main>
  </body>
</html>
